<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nos mudamos · Juegos de Mesa Digital PY</title>
<meta name="robots" content="noindex">
<script>
// El juego se mudó a "Juegos de Mesa Digital PY". Se manda al jugador a la misma sección en el sitio nuevo,
// conservando el código de sala (#CÓDIGO o ?sala=) para que pueda entrar directo.
(function(){
  var cf = /\.pages\.dev$/.test(location.hostname);
  var base = cf ? 'https://juegosdemesapy.pages.dev/' : 'https://jleov.github.io/juegosdemesapy/';
  var seccion = /\/loteria\//.test(location.pathname) ? 'loteria/' : 'banquero/';
  var destino = base + seccion + location.search + location.hash;
  // se quita la app vieja guardada en el celular (solo la de esta dirección, no la del sitio nuevo)
  try{ if(navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ if(r.scope.indexOf('/juegosdemesapy/')<0) r.unregister(); }); }); }catch(e){}
  window.__destino = destino;
  location.replace(destino);
})();
</script>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1c1240;color:#fff;font-family:system-ui,sans-serif;text-align:center;padding:16px}a{color:#f2c14e;font-weight:800}</style>
</head>
<body>
<div><h1>¡Nos mudamos! 🎲</h1>
<p>Ahora el Banquero y la Lotería están en <b>Juegos de Mesa Digital PY</b>.</p>
<p><a id="ir" href="https://jleov.github.io/juegosdemesapy/">Ir al sitio nuevo</a></p></div>
<script>document.getElementById('ir').href = window.__destino || document.getElementById('ir').href;</script>
</body>
</html>
